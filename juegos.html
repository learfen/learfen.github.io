	<link rel="stylesheet" href="styles.css?d=04-10-26-06-21-2026">
	<style>
		body {
			padding: 0;
			min-height: 100vh;
			justify-content: center;
			overflow: hidden;
		}
		button {
			text-transform: uppercase;
		}
		.scene {
			margin: 0 !important;
		}

		#import-overlay {
			position: fixed;
			inset: 0;
			z-index: 1000;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, .85);
		}

		#import-overlay.arrastrando {
			background: rgba(30, 60, 90, .92);
		}

		#import-box {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
			padding: 28px 34px;
			border: 1px solid #333;
			border-radius: 12px;
			background: #111;
			color: #e5e5e5;
			font-family: system-ui, sans-serif;
			text-align: center;
		}

		#import-box h1 {
			margin: 0;
			font-size: 20px;
		}

		#import-box p {
			margin: 0;
			color: #aaa;
			font-size: 14px;
		}

		#import-elegir,
		#import-otro,
		.btn {
			font: inherit;
			padding: 9px 16px;
			border-radius: 8px;
			border: 1px solid #444;
			background: #222;
			color: #eee;
			cursor: pointer;
		}

		#import-elegir:hover {
			background: #2e2e2e;
		}

		.menu-juegos {
			position: fixed;
			top: 8px;
			right: 8px;
			z-index: 1001;
			opacity: .35;
			font-size: 12px;
			padding: 5px 10px;
		}

		.menu-juegos:hover {
			opacity: 1;
		}

		/* alternativa al joystick analogico: botones que emiten los mismos
		   eventos que las flechas del teclado (mismo cooldown y desliz) */
		.neto-dpad {
			position: fixed;
			left: max(16px, env(safe-area-inset-left));
			bottom: max(16px, env(safe-area-inset-bottom));
			display: grid;
			grid-template-columns: repeat(3, 48px);
			grid-template-rows: repeat(3, 48px);
			gap: 4px;
			pointer-events: auto;
			z-index: 3000;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}

		.neto-dpad button {
			border: 2px solid rgba(255, 255, 255, .35);
			border-radius: 10px;
			background: rgba(37, 99, 235, .8);
			color: #fff;
			font-size: 20px;
			line-height: 1;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}

		.neto-dpad button:active {
			background: rgba(29, 78, 216, .95);
			transform: scale(.95);
		}

		.neto-dpad button[data-dir="arriba"] { grid-area: 1 / 2; }
		.neto-dpad button[data-dir="izquierda"] { grid-area: 2 / 1; }
		.neto-dpad button[data-dir="derecha"] { grid-area: 2 / 3; }
		.neto-dpad button[data-dir="abajo"] { grid-area: 3 / 2; }

		.neto-acciones {
			position: fixed;
			right: max(16px, env(safe-area-inset-right));
			bottom: max(16px, env(safe-area-inset-bottom));
			display: flex;
			flex-direction: column;
			gap: 8px;
			pointer-events: auto;
			z-index: 3000;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}

		.neto-acciones button {
			width: 64px;
			height: 64px;
			border: 2px solid rgba(255, 255, 255, .35);
			border-radius: 999px;
			background: rgba(16, 185, 129, .85);
			color: #fff;
			font-size: 14px;
			font-weight: 700;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}

		.neto-acciones button:active,
		.neto-acciones button.activo {
			background: rgba(5, 150, 105, .95);
			transform: scale(.95);
		}

		/* el analogico queda en el DOM, solo oculto por ahora */
		body.jugando #neto-controls .neto-joystick {
			display: none;
		}

		/* telefono en vertical: la escena ocupa el alto y los controles van abajo,
		   sin taparla (esta vista no se usa para desarrollar) */
		@media (max-width: 960px) and (orientation: portrait) {
			body.jugando .scene {
				position: fixed;
				inset: 0 0 200px 0;
				width: auto;
				max-width: none;
				height: auto;
				aspect-ratio: auto;
				transform: none;
				margin: 0 !important;
				border: 0;
				border-radius: 0;
			}

			body.jugando .camera-viewport {
				width: 100%;
				height: 100%;
				border-radius: 0;
				box-shadow: none;
			}

			body.jugando #neto-controls .neto-joystick,
			body.jugando #neto-controls .neto-actions {
				top: auto;
				bottom: max(16px, env(safe-area-inset-bottom));
			}

			body.jugando #neto-controls .neto-actions {
				height: auto;
			}

			body.jugando #neto-controls .neto-joystick {
				left: max(16px, env(safe-area-inset-left));
			}

			body.jugando #neto-controls .neto-actions {
				right: max(16px, env(safe-area-inset-right));
			}
		}
	</style>
	<script>
		// sin seleccion de celdas/personajes: es un reproductor, no el editor
		window.modoJuego = true;
		// La escena se elige por ?escena=; si el usuario recarga sin el query,
		// lo restauramos desde el nombre guardado antes de que arranque scene.js.
		(function () {
			const p = new URLSearchParams(location.search);
			if (p.get("escena")) return;
			const n = localStorage.getItem("juegoLocalNombre");
			if (!n) return;
			const u = new URL(location.href);
			u.searchParams.set("escena", n);
			history.replaceState(null, "", u);
		})();
	</script>
</head>

	<script>
		const K_CODE = "juegoLocal";
		const K_NAME = "juegoLocalNombre";

		function parsearEscena(code) {
			// misma normalizacion que el editor (index.html): idempotente con el token
			return code
				.replaceAll("interactuar ( async", "@INTERACTUAR@")
				.replaceAll("interactuar( async", "@INTERACTUAR@")
				.replaceAll("interactuar (", "@INTERACTUAR@")
				.replaceAll("interactuar(", "@INTERACTUAR@")
				.replaceAll("@INTERACTUAR@", "interactuar( async ")
				.replaceAll("function juego  (", "function juego(")
				.replaceAll("function juego (", "function juego(")
				.replaceAll("function juego(", "async function juego(")
				.replaceAll(" preguntar (", " preguntar(")
				.replaceAll(" preguntar(", " await preguntar(")
				.replaceAll(" si(", "if(")
				.replaceAll(" si (", "if(")
				.replaceAll(" sino (", "sino(")
				.replaceAll(" sino(", "else if(")
				.replaceAll(" sino{", "else{")
				.replaceAll(" sino {", "else{");
		}

		function evaluarEscena(code) {
			if (!code || code.indexOf("function juego") === -1) return false;
			const script = document.createElement("script");
			script.innerHTML = parsearEscena(code);
			document.body.appendChild(script);
			return true;
		}

		function instalarDpad() {
			const controles = document.getElementById("neto-controls") || document.body;
			if (!controles.querySelector(".neto-dpad")) {
				const dpad = document.createElement("div");
				dpad.className = "neto-dpad";
				dpad.setAttribute("aria-label", "Mover personaje");
				dpad.innerHTML = `
					<button type="button" data-dir="arriba" aria-label="Arriba">▲</button>
					<button type="button" data-dir="izquierda" aria-label="Izquierda">◀</button>
					<button type="button" data-dir="derecha" aria-label="Derecha">▶</button>
					<button type="button" data-dir="abajo" aria-label="Abajo">▼</button>`;
				controles.appendChild(dpad);
				const teclas = {
					arriba: "ArrowUp",
					abajo: "ArrowDown",
					izquierda: "ArrowLeft",
					derecha: "ArrowRight",
				};
				dpad.querySelectorAll("button[data-dir]").forEach((boton) => {
					const key = teclas[boton.dataset.dir];
					const presionar = (ev) => {
						ev.preventDefault();
						try {
							boton.setPointerCapture?.(ev.pointerId);
						} catch {}
						document.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, repeat: false }));
					};
					const soltar = () =>
						document.dispatchEvent(new KeyboardEvent("keyup", { key, bubbles: true }));
					boton.addEventListener("pointerdown", presionar);
					boton.addEventListener("pointerup", soltar);
					boton.addEventListener("pointercancel", soltar);
					boton.addEventListener("lostpointercapture", soltar);
				});
			}
			if (!controles.querySelector(".neto-acciones")) {
				const acciones = document.createElement("div");
				acciones.className = "neto-acciones";
				acciones.innerHTML = `<button style="margin-bottom:50px" type="button" data-accion="empujar" aria-label="Empujar/Tirar">AGARRAR</button>`;
				controles.appendChild(acciones);
				const btn = acciones.querySelector('[data-accion="empujar"]');
				const key = "s";
				const presionar = (ev) => {
					ev.preventDefault();
					try { btn.setPointerCapture?.(ev.pointerId); } catch {}
					btn.classList.add("activo");
					document.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, repeat: false }));
				};
				const soltar = (ev) => {
					ev.preventDefault();
					btn.classList.remove("activo");
					document.dispatchEvent(new KeyboardEvent("keyup", { key, bubbles: true }));
				};
				btn.addEventListener("pointerdown", presionar);
				btn.addEventListener("pointerup", soltar);
				btn.addEventListener("pointercancel", soltar);
				btn.addEventListener("lostpointercapture", soltar);
			}
		}

		function importar(file) {
			if (!file) return;
			file.text().then((code) => {
				if (code.indexOf("function juego") === -1) {
					alert("El archivo no contiene una función juego().");
					return;
				}
				const name = (file.name || "juego").replace(/\.js$/i, "") || "juego";
				localStorage.setItem(K_CODE, code);
				localStorage.setItem(K_NAME, name);
				const u = new URL("juegos.html", location.href);
				u.searchParams.set("escena", name);
				u.searchParams.set("t", Date.now());
				location.href = u;
			}).catch((e) => alert("No se pudo leer el archivo: " + e));
		}

		const overlay = document.getElementById("import-overlay");
		const input = document.getElementById("import-file");
		const otro = document.getElementById("import-otro");
		const menuJuegos = document.querySelector(".menu-juegos");
		const dialogJuegos = document.querySelector("dialog#juegos");
		
		if(!localStorage.getItem(K_CODE)){
			dialogJuegos.showModal();
		}
		document.querySelectorAll("dialog#juegos .container>button.game").forEach((boton) => {
			boton.addEventListener("click", () => {
				// peticion a /games/{file}.js
				fetch(`/games/${boton.innerHTML}.js`).then((r) => r.text()).then((code) => {
					if (evaluarEscena(code)) {
						localStorage.setItem(K_CODE, code);
						localStorage.setItem(K_NAME, boton.innerHTML);
						const u = new URL("juegos.html", location.href);
						u.searchParams.set("escena", boton.innerHTML);
						u.searchParams.set("t", Date.now());
						location.href = u;
					}
				});
			});
		})
		dialogJuegos.addEventListener("click", (ev) => {
			if(ev.target.tagName === "DIALOG"){
				dialogJuegos.close();
			}
		});
		menuJuegos.addEventListener("click", () => dialogJuegos.showModal());
		document.getElementById("import-elegir").addEventListener("click", () => input.click());
		input.addEventListener("change", () => importar(input.files[0]));
		overlay.addEventListener("dragover", (e) => {
			e.preventDefault();
			overlay.classList.add("arrastrando");
		});
		overlay.addEventListener("dragleave", () => overlay.classList.remove("arrastrando"));
		overlay.addEventListener("drop", (e) => {
			e.preventDefault();
			overlay.classList.remove("arrastrando");
			importar(e.dataTransfer.files[0]);
		});
		otro.addEventListener("click", () => {
			localStorage.removeItem(K_CODE);
			localStorage.removeItem(K_NAME);
			location.href = "juegos.html";
		});

		// un juego local es autocontenido: no hay global.js remoto que cargar
		globalCargado = true;
		globalListos = true;

		const guardado = localStorage.getItem(K_CODE);
		if (guardado) {
			overlay.remove();
			otro.hidden = false;
			evaluarEscena(guardado);
			window.instalarJoystickNeto?.();
			instalarDpad();
			const reencuadrar = () =>
				setTimeout(() => escenaActiva().actualizarCamara(), 100);
			addEventListener("resize", reencuadrar);
			addEventListener("orientationchange", reencuadrar);
			setTimeout(reencuadrar, 800);
		}
	</script>
