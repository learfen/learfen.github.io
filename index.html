		function revisionImagenes() {
			let codigo = editor.getValue()
			let imagenesUsadasCodigo = [...codigo.matchAll(
				/escenaActiva\(\)\s*\.agregar\(\s*\d+\s*,\s*\d+\s*,\s*"([^"]+)"/g
			)].map(m => m[1]);

			if (localStorage.getItem("escenaSeleccionada") === 'global') {
				// si en el codigo existe pescar(
				let pescarCut = codigo.split('pescar([')
				if (pescarCut.length > 1) {
					// si no tiene la funcion pescar
					let imagesArray = JSON.parse(`[${pescarCut[1].split(']')[0]}]`)
					for (let key of imagesArray) {
						imagenesUsadasCodigo.push(key)
					}
				}
			}

			// usamos set para eliminar repetidos
			imagenesUsadasCodigo = Array.from(new Set(imagenesUsadasCodigo))

			const imagenesImportadasCodigo = [...codigo.matchAll(/usarImagen\(\s*"([^"]+)"/g)].map(m => m[1]);
			// un alias base es valido si existe importado tal cual o con variantes
			// direccionales ("lobo" existe si se importaron lobo-abajo/derecha/...)
			// ponytail: el codigo es la fuente de verdad. sin el match exacto aqui,
			// insertar usarImagen() no saca el error: imagenesImportadas es el
			// registro en runtime y va con retraso, asi que daba falso positivo.
			const existeImagen = (key) =>
				imagenesImportadas.hasOwnProperty(key) ||
				imagenesImportadasCodigo.includes(key) ||
				imagenesImportadasCodigo.some(k => k.startsWith(key + "-"));
			for (let key of imagenesUsadasCodigo) {
				if (!existeImagen(key)) {
					errorRender(`No importaste la imagen : "${key}" en la escena. <br>Elige en <b>RECURSOS</b> y escribe <b>${key}</b> cuando selecciones y pregunte el alias.`).setGroup("imagen", key)
				} else {
					errorRender().clearGroup("imagen", key)
				}
			}
		}

		function revisionCodigo() {
			let codigo = String(editor.getValue())
			// si la escena activa es global
			if (fileOpen != 'global' && fileOpen != 'global.js') {
				// si no tiene la funcion juego
				if (!codigo.includes("juego") ) {
					errorRender("No tienes la funcion juego").setGroup("juego")
				} else {
					errorRender().clearGroup("juego")
				}
				// si no tiene la funcion escenaActiva
				if (!codigo.includes("empezarEn")) {
					errorRender("No tienes la funcion escenaActiva").setGroup("player-start")
				} else {
					errorRender().clearGroup("player-start")
				}
			}
			// si no tiene la misma cantidad de { abiertos que cerrados
			let abiertos = [...codigo.matchAll(/\{/g)].length
			let cerrados = [...codigo.matchAll(/\}/g)].length
			if (abiertos != cerrados) {
				errorRender("Te falto cerrar o abrir llaves <b>{}</b>").setGroup("llaves")
			} else {
				errorRender().clearGroup("llaves")
			}
			// lo mismo con los parentesis ahora
			abiertos = [...codigo.matchAll(/\(/g)].length
			cerrados = [...codigo.matchAll(/\)/g)].length
			if (abiertos != cerrados) {
				errorRender("Te falto cerrar o abrir parentesis <b>( )</b>").setGroup("parentesis")
			} else {
				errorRender().clearGroup("parentesis")
			}
			// lo mismo con los corchetes ahora
			abiertos = [...codigo.matchAll(/\[/g)].length
			cerrados = [...codigo.matchAll(/\]/g)].length
			if (abiertos != cerrados) {
				errorRender("Te falto cerrar o abrir corchetes <b>[ ]</b>").setGroup("corchetes")
			} else {
				errorRender().clearGroup("corchetes")
			}


			// si no tiene la funcion escenaActiva
			if (codigo.includes("escenaActiva.")) {
				errorRender("escenaActiva es una funcion, lleva parentesis asi: <b>escenaActiva()</b>").setGroup("escena-error-1")
			} else {
				errorRender().clearGroup("escena-error-1")
			}
		}

		let onloaded = false
		let installedImages = false
		let imagesBackend = null
		let editor = null
		let fileOpen = ""
		let stateChanges = {
			code: "",
		};
		let guardarTimer = null;

			setTimeout(() => {

		const toastManager = () => {
			let toastContainer = document.createElement("div");
			toastContainer.classList.add("relative", "mt-4", "top-5", "end-5", "bg-black/40", "w-full", "h-fit", "flex", "justify-center", "items-center", "text-white", "text-2xl", "font-bold", "p-0", "rouned-lg");
			toastContainer.zIndex = "2000";
			document.querySelector('#toast-container').appendChild(toastContainer);
			return {
				push(html, seconds) {
					if (!seconds) seconds = 3
					// insertamos un div
					let div = document.createElement("div");
					div.classList.add("w-full", "flex", "justify-center", "items-center", "text-white", "text-sm", "uppercase", "font-bold", "p-1", "m-1", "rouned-lg");

					if (seconds) esperarY(seconds, async () => {

						await esperar(1)
						div.remove()
					})
					return div
				}
			}
		}

		function installImagesEditor() {
			if (installedImages) return;
			installedImages = true
			const pushImage = (image) => {
				const imageItem = document.createElement("img");
				imageItem.src = "/games/images/" + image;
				imageItem.alt = image;
				imageItem.style.width = "auto";
				imageItem.style.height = "40px";
				images.appendChild(imageItem);
			}
			function listImagesManager(data, cursor) {
				if (cursor === undefined) {
					cursor = -1
				}

				let total = data.length
				let pageSize = 20
				let pages = Math.ceil(data.length / pageSize)
				let imageIndex = document.querySelector("#imageIndex")
				const updateStatus = () => imageIndex.innerHTML = `${cursor + 1} / ${pages}`
				const render = () => {
					document.querySelector("#images").innerHTML = "";

					for (let i = cursor * pageSize; i < (cursor * pageSize) + pageSize; i++) {
						if (i == data.length) break;
						pushImage(data[i])
					}

					updateStatus()
				}
				return {
					total,
					pages,
					cursor,
					next() {
						if (pages > cursor + 1) {
							cursor++
							render()
						}
					},
					back() {
						if (cursor - 1 > -1) {
							cursor--
							render()
						}
					},
					reload() {
						onloaded = false
						listImages()
					}
				}
			}
			const listImages = (e) => {
				if (e !== undefined) e.target.parentNode.click()
				if (!document.querySelector("#imageIndex")) return;
				if (!onloaded) {
					onloaded = true
					getImagesFromGithub()
					//$fetch("/api/images")
						.then((data) => {
							imagesBackend = listImagesManager(data)
							imagesBackend.next()
						})
						.catch((error) => {
							errorRender("No se pudieron cargar las imagenes")
							console.error("Error:", error);
						});
				}
			}


			const upload = () => {
				// create input file
				const image = document.createElement("input");
				image.type = "file";
				image.accept = "image/*";
				image.onchange = (e) => {
					const file = e.target.files[0];
					const formData = new FormData();
					formData.append("file", file);
					$fetch("/api/images", {
						body: formData,
					})
						.then((data) => {
							if (data.hasOwnProperty("error")) return errorRender(data.error)
							pushImage(data.filename)
							toastManager().push("Imagen cargada con exito")
						})
						.catch((error) => {
							errorRender(String(error))
							console.error("Error:", error);
						});
				};
				image.click();
			}

			const addImage = (e) => {
				if (e.target.tagName !== "IMG") return
				let ref = prompt("Ingresa un alias para la imagen")
				if (!ref) return;
				const code = `usarImagen("${ref}","${e.target.src.replace(location.href, "/")}")`;
				useEditor.setValue(code + ";\n" + useEditor.getValue());
				images.previousElementSibling.click()
			}
			listImages()
			//document.querySelector("#listImages").addEventListener("click", listImages);
			//document.querySelector("#images").addEventListener("click", addImage);
			//document.querySelector("#upload").addEventListener("click", upload);

		}

		function menuDefault(){
	

			empezarEn(0, 0);

			relatar([`
				#### Controles

				- Usa las flechas del teclado para moverte
				- Presiona E para atacar
				- Presiona D para saltar

				[Jugar](/?neto=1&escena=nivel1&sala=prueba-nivel1)

		function juegoDefault(){
			// ¿Donde empieza el jugador?
			empezarEn(0, 0);


		// fin juego
		}


		// Cargar archivo del usuario desde GAS
		const openFile = async (fileName) => {
			if(!fileName) return ;
			if (!editor) {
				await new Promise((resolve) => {
					let x = setInterval(() => {
						if (typeof editorOpen === 'function') {
							clearInterval(x);
							resolve();
						}
					}, 10);
				});
			}

			editorOpen();

			toastManager().push("Cargando archivo...");
			console.log('abiendo archivo', fileName)
			const nodoFileName = document.querySelector("#fileName");
			nodoFileName.innerHTML = `Cargando(${fileName}) ... `;
			try {
				let result = {status:"success", code : localStorage.getItem("file:"+fileName.replace('.js',''))}
				if(!result.code)
					result = await $fetch(`/api/file/${fileName}`);
				
				if (result.status === "success") {
					try {
						pushChanges = false;
					fileOpen = fileName;
					codeDataText = result.code || "";
					if(!codeDataText){
						// si es menu
						if(fileName == "menu") codeDataText = String(menuDefault)
							// eliminaremos los tabs duplicados para que se vea bien 
							.replaceAll('\t\t','\t')
							.replaceAll('		','	')
							// reemplazaremos el nombre de la funcion
							.replace('menuDefault','juego')
						else {
							codeDataText = String(juegoDefault).replace('juegoDefault','juego')
						}
					}
					// cacheamos desde la primera apertura: solo el guardar viaja a Google
					localStorage.setItem("file:"+fileName.replace('.js',''), codeDataText)
					editor.setValue(codeDataText);

					// evaluar la escena: sin esto `juego` no existe y la pantalla queda vacia
					if (codeDataText.indexOf("function juego") !== -1) {
						let script = document.createElement("script")
						let parsed = codeDataText
							.replaceAll("interactuar (", "interactuar(")
							.replaceAll("interactuar(", "interactuar( async ")
							.replaceAll("function juego  (", "function juego(")
							.replaceAll("function juego (", "function juego(")
							.replaceAll("function juego(", "async function juego(")
							.replaceAll(" preguntar (", " preguntar(")
							.replaceAll(" preguntar(", " await preguntar(")
							.replaceAll(" si(", "if(")
							.replaceAll(" si (", "if(")
							.replaceAll(" sino (", "sino(")
							.replaceAll(" sino(", "else if(")
							.replaceAll(" sino{", "else{")
							.replaceAll(" sino {", "else{");
						script.innerHTML = parsed
						document.body.appendChild(script)
					}

					toastManager().push("Archivo cargado correctamente");
					nodoFileName.innerHTML = fileName;
					} catch (error) {
						console.log("Error al procesar el archivo:", error);
						toastManager().push("Error al procesar el archivo");
					}
					return true;
				} else {
					toastManager().push("No se encontró el archivo.");
					return false;
				}
			} catch (error) {
				console.log("Error al abrir archivo:", error);
				toastManager().push("Error al conectar con Google Apps Script");
				return false;
			}
		};

		// Guardar archivo en GAS (debounce: un unico timer que se reinicia al escribir)
		const updateChanges = (config) => {
			if (localStorage.getItem("userFile") == "tutorial") return;

			config = config || { force: false, next: null };
			// solo guarda si hay diferencias reales con lo ultimo escrito a disco
			if (stateChanges.code == useEditor.getValue() && !config?.force) return;

			clearTimeout(guardarTimer);
			if (config?.force) return guardarCambios(config);
			// espera N ms desde la ultima tecla antes de enviar (debounce)
			guardarTimer = setTimeout(() => guardarCambios(config), 1500);
		};

		const guardarCambios = (config) => {
			const toast = toastManager().push('Guardando código...');
			const newCodeDataText = useEditor.getValue();
			stateChanges.code = newCodeDataText;

			$fetch("/api/file", {
				body: JSON.stringify({
					fileName: fileOpen,
					code: newCodeDataText
				})
			})
				.then((data) => {
					// primero actualizamos el local; si no, la recarga de
					// config.next() mata la escritura y queda el codigo viejo.
					// openFile lee la clave SIN .js, por eso la normalizamos
					localStorage.setItem("file:"+fileOpen.replace('.js',''), newCodeDataText)
					toast.innerHTML = '¡Guardado completo!';
					if (typeof config.next === "function") config.next();
					setTimeout(() => toast.remove(), 2000);
				})
				.catch((error) => {
					toast.style.background = "tomato";
					toast.innerHTML = 'No se pudo guardar: ' + String(error);
					console.error("Error:", error);
				});
		};

		abrirEscena()

		const getButtonDropdownNav = (text) => {
			let container = document.createElement("div");
			container.style.cssText = "display:flex;align-items:center;gap:2px;";

			let button = document.createElement("button");
			button.classList.add("btn", "w-full", "p-1", "toggle-btn");
			button.innerHTML = text.replace('.js', '');
			button.setAttribute('name', text)

			let pencil = document.createElement("button");
			pencil.classList.add("btn", "pencil-btn");
			pencil.innerHTML = "&#9998;";
			pencil.title = "Renombrar";
			pencil.setAttribute('data-scene', text);
			pencil.style.cssText = "font-size:1.1em;padding:2px 6px;opacity:0.6;cursor:pointer;flex-shrink:0;";

			container.appendChild(button);
			container.appendChild(pencil);
			return container;
		};

		document.addEventListener("click", (e) => {
			const pencil = e.target.closest?.(".pencil-btn");
			if (!pencil) return;
			e.stopPropagation();
			const oldName = pencil.getAttribute("data-scene").replace('.js', '');
			const newName = prompt("Nuevo nombre:", oldName);
			if (!newName || newName === oldName) return;
			$fetch("/api/files/rename", {
				body: JSON.stringify({ oldName, newName })
			}).then(r => r.json()).then(d => {
				if (d.error) return alert(d.error);
				const finalName = d.file || newName;
				// la lista viene del cache: la actualizamos con el nuevo nombre
				let lista = localStorage.getItem("/api/files");
				if (lista) {
					lista = JSON.parse(lista);
					lista.data = lista.data.map(f => f === oldName+".js" ? finalName+".js" : f);
					lista.time = Date.now();
					localStorage.setItem("/api/files", JSON.stringify(lista));
				}
				if (escenaSeleccionada === oldName) {
					localStorage.setItem("escenaSeleccionada", finalName);
					location.reload();
				} else {
					document.querySelector("#myListScene").innerHTML = "";
					listFiles();
				}
			});
		});
		const listFiles = () => {
			const openData = data => {
				let x = setInterval(() => {

						let myListScene = document.querySelector("#myListScene");
						if (myListScene) {
							
							data.sort((a, b) => a.localeCompare(b)).forEach((file) => {
								myListScene.appendChild(getButtonDropdownNav(file));
							});

							if (!localStorage.getItem("escenaSeleccionada")) {
								// si existe "menu" en la lista abrimos
								localStorage.setItem("escenaSeleccionada", "menu")
								abrirEscena()
							}

							clearInterval(x);
						}

					}, 100)
			}
			// la lista viene del cache; se actualiza solo al crear o renombrar escenas
			if(localStorage.getItem("/api/files")){
				let data = JSON.parse(localStorage.getItem("/api/files"))
				return openData(data.data)
			}
			$fetch("/api/files")
				.then((data) => {
					localStorage.setItem("/api/files", JSON.stringify({data, time: Date.now()}))
					openData(data)
				}).catch((error) => {
					console.log("Error:", error);
				});
		};
		listFiles()
	</script>
</body>

</html>
